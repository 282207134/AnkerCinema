name: anker_cinema
description: A Pixso-inspired cinema booking app with an offline demo flow.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Futura
      fonts:
        - asset: assets/fonts/Futura.ttf
    - family: FuturaCondensed
      fonts:
        - asset: assets/fonts/FuturaCondensed.ttf
